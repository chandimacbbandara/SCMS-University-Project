<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Email - Academy of Knowledge Bridge</title>
    <link rel="stylesheet" href="/CSS/main.css">
    <style>
        body { background: #f4f6fb; }
        .verify-wrapper {
            min-height: calc(100vh - 160px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 32px 16px;
        }
        .verify-card {
            width: 100%;
            max-width: 480px;
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 14px 40px rgba(0,0,0,0.08);
            padding: 28px;
        }
        .verify-card h2 {
            margin: 0 0 6px;
            color: #222;
            font-size: 24px;
        }
        .verify-card p {
            margin: 0 0 18px;
            color: #666;
            font-size: 14px;
        }
        .alert {
            padding: 10px 12px;
            border-radius: 10px;
            margin-bottom: 14px;
            font-size: 13px;
            font-weight: 600;
        }
        .alert-success { background: #e8f5e9; color: #2e7d32; border: 1px solid #a5d6a7; }
        .alert-error { background: #ffebee; color: #c62828; border: 1px solid #ef9a9a; }
        .form-group { margin-bottom: 14px; }
        .form-group label {
            display: block;
            margin-bottom: 6px;
            color: #444;
            font-weight: 700;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .form-group input {
            width: 100%;
            padding: 12px;
            border: 2px solid #eee;
            border-radius: 10px;
            font-size: 14px;
            background: #fafbfc;
            transition: border-color .2s;
            box-sizing: border-box;
        }
        .form-group input:focus {
            outline: none;
            border-color: #e53935;
            background: #fff;
        }
        .actions {
            display: flex;
            gap: 10px;
            margin-top: 6px;
        }
        .btn-primary, .btn-secondary {
            border: none;
            border-radius: 10px;
            padding: 12px 14px;
            font-weight: 700;
            cursor: pointer;
        }
        .btn-primary {
            background: #e53935;
            color: #fff;
            flex: 1;
        }
        .btn-primary:hover { background: #c62828; }
        .btn-secondary {
            background: #f3f4f6;
            color: #333;
        }
        .hint {
            margin-top: 12px;
            font-size: 12px;
            color: #777;
        }
    </style>
</head>
<body>
<header>
    <div class="container header-content">
        <div class="logo-area">
            <img th:src="@{/images/img1.jpeg}" src="/images/img1.jpeg" alt="Institute Logo" class="brand-logo">
            <div class="logo-text">
                <span>Academy of</span>
                <span>Knowledge Bridge</span>
            </div>
        </div>
    </div>
</header>

<main>
    <div class="verify-wrapper">
        <div class="verify-card">
            <h2>Verify Your Email</h2>
            <p>Enter the 6-digit code sent to your email address.</p>

            <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
            <div th:if="${errorMessage}" class="alert alert-error" th:text="${errorMessage}"></div>

            <form th:action="@{/verify-email}" method="post">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" name="email" th:value="${email}" required>
                </div>
                <div class="form-group">
                    <label>Verification Code</label>
                    <input type="text" name="code" maxlength="6" pattern="[0-9]{6}" placeholder="Enter 6-digit code" required>
                </div>
                <div class="actions">
                    <button type="submit" class="btn-primary">Verify Code</button>
                </div>
            </form>

            <form th:action="@{/verify-email/resend}" method="post" style="margin-top: 10px;">
                <input type="hidden" name="email" th:value="${email}">
                <button type="submit" class="btn-secondary">Resend Code</button>
            </form>

            <div class="hint">Code expires in 10 minutes. After verification, admin approval is still required before login.</div>
        </div>
    </div>
</main>
</body>
</html>
