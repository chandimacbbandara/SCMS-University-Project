<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update FAQ - Academy of Knowledge Bridge</title>
    <link rel="stylesheet" href="/CSS/main.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #e53935;
            --primary-bg: rgba(229, 57, 53, 0.08);
            --bg-body: #f0f2f5;
            --bg-white: #ffffff;
            --card-shadow: 0 4px 20px rgba(0,0,0,0.08);
            --text-dark: #1a1a2e;
            --text-mid: #555;
            --border: #e8e8e8;
            --radius-md: 18px;
            --radius-lg: 24px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: var(--bg-body); font-family: 'Inter', sans-serif; color: var(--text-dark); }
        .owner-container { max-width: 600px; margin: 50px auto; padding: 0 24px; }
        
        .update-card { background: var(--bg-white); border-radius: var(--radius-lg); box-shadow: var(--card-shadow); border: 1px solid var(--border); overflow: hidden; }
        .card-header { background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%); padding: 22px 28px; display: flex; align-items: center; gap: 14px; color: #fff; }
        .card-header-icon { width: 44px; height: 44px; border-radius: 12px; background: rgba(255,255,255,0.2); display: flex; align-items: center; justify-content: center; font-size: 18px; color: #fff; }
        .card-header-text h2 { font-size: 16px; font-weight: 800; }
        
        .card-body { padding: 28px; }
        .form-group { margin-bottom: 18px; }
        .form-label { display: block; font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; color: var(--text-mid); margin-bottom: 7px; }
        .form-control { width: 100%; padding: 12px 16px; border: 2px solid #eee; border-radius: 12px; font-size: 13px; font-family: 'Inter', sans-serif; outline: none; transition: 0.3s; }
        .form-control:focus { border-color: #3b82f6; }
        textarea.form-control { resize: vertical; min-height: 140px; }
        
        .btn-update { display: flex; align-items: center; justify-content: center; gap: 8px; color: #fff; border: none; padding: 14px 32px; border-radius: 12px; font-size: 14px; font-weight: 700; cursor: pointer; width: 100%; background: linear-gradient(135deg, #3b82f6, #2563eb); transition: 0.3s; margin-top: 10px; }
        .btn-update:hover { transform: translateY(-2px); }
        .btn-cancel { display: block; text-align: center; margin-top: 16px; color: var(--text-mid); text-decoration: none; font-size: 13px; font-weight: 600; }
        .btn-cancel:hover { color: var(--text-dark); }
    </style>
</head>
<body>
    <div class="owner-container">
        <div class="update-card">
            <div class="card-header">
                <div class="card-header-icon"><i class="fas fa-edit"></i></div>
                <div class="card-header-text">
                    <h2>Update FAQ Details</h2>
                </div>
            </div>
            <div class="card-body">
                <form th:action="@{/owner/faq/faq/update/{id}(id=${faq.faqId})}" method="post">
                    <div class="form-group">
                        <label class="form-label">Question</label>
                        <input type="text" name="question" class="form-control" th:value="${faq.question}" required maxlength="200">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Answer</label>
                        <textarea name="answer" class="form-control" required maxlength="900" th:text="${faq.answer}"></textarea>
                    </div>
                    <button type="submit" class="btn-update"><i class="fas fa-save"></i> Save Changes</button>
                    <a href="/owner/faq" class="btn-cancel">Cancel & Go Back</a>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
