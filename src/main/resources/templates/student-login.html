<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Login - Akademy of Knowledge Bridge</title>
    <link rel="stylesheet" href="/CSS/main.css">
    <style>
        .login-container {
            max-width: 480px;
            margin: 60px auto;
            padding: 0 20px;
        }

        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .login-header h2 {
            color: #1a237e;
            font-size: 32px;
            margin-bottom: 8px;
        }

        .login-header p {
            color: #666;
            font-size: 16px;
        }

        .login-card {
            background: #fff;
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.1);
            border-top: 5px solid #1a237e;
        }

        .login-icon {
            text-align: center;
            margin-bottom: 25px;
        }

        .login-icon .icon-circle {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(135deg, #1a237e, #283593);
            color: #fff;
            font-size: 36px;
        }

        .form-group {
            margin-bottom: 22px;
        }

        .form-group label {
            display: block;
            font-weight: 700;
            color: #1a237e;
            margin-bottom: 8px;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-group label .required {
            color: #e53935;
        }

        .form-group input[type="email"],
        .form-group input[type="password"] {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 15px;
            font-family: 'Segoe UI', Arial, sans-serif;
            transition: border-color 0.3s, box-shadow 0.3s;
            background: #fafafa;
        }

        .form-group input:focus {
            outline: none;
            border-color: #1a237e;
            box-shadow: 0 0 0 3px rgba(26, 35, 126, 0.1);
            background: #fff;
        }

        .form-group input::placeholder {
            color: #aaa;
        }

        .input-icon-wrapper {
            position: relative;
        }

        .input-icon-wrapper .input-icon {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 18px;
            color: #aaa;
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #1a237e, #283593);
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
        }

        .login-btn:hover {
            background: linear-gradient(135deg, #283593, #3949ab);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(26, 35, 126, 0.3);
        }

        .login-btn:active {
            transform: translateY(0);
        }

        /* Alert Messages */
        .alert {
            padding: 15px 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-weight: 600;
            font-size: 14px;
        }

        .alert-success {
            background: #e8f5e9;
            color: #2e7d32;
            border: 1px solid #a5d6a7;
        }

        .alert-error {
            background: #ffebee;
            color: #c62828;
            border: 1px solid #ef9a9a;
        }

        .alert-warning {
            background: #fff3e0;
            color: #e65100;
            border: 1px solid #ffcc02;
        }

        .register-link {
            text-align: center;
            margin-top: 25px;
            font-size: 14px;
            color: #666;
        }

        .register-link a {
            color: #1a237e;
            font-weight: 700;
            text-decoration: none;
        }

        .register-link a:hover {
            text-decoration: underline;
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 15px;
            margin: 20px 0;
            color: #ccc;
            font-size: 13px;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #e0e0e0;
        }

        @media (max-width: 500px) {
            .login-card {
                padding: 25px;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="container header-content">
            <div class="logo-area">
                <img src="/images/img1.jpeg" alt="Institute Logo" class="brand-logo">
                <h1>Akademy of Knowledge Bridge</h1>
            </div>
            <nav>
                <ul>
                    <li><a href="/">Home</a></li>
                    <li><a href="/login" style="color: #ffc107;">Login</a></li>
                    <li><a href="/register">Register</a></li>
                    <li><a href="/submit-concern">Report Issue</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <div class="login-container">
            <div class="login-header">
                <h2>Login</h2>
                <p>Sign in to access your portal</p>
            </div>

            <!-- Success Message -->
            <div th:if="${successMessage}" class="alert alert-success">
                <span th:text="${successMessage}"></span>
            </div>

            <!-- Error Message -->
            <div th:if="${errorMessage}" class="alert alert-error">
                <span th:text="${errorMessage}"></span>
            </div>

            <div class="login-card">
                <div class="login-icon">
                    <div class="icon-circle">&#128100;</div>
                </div>

                <form th:action="@{/login}" method="post" id="loginForm">
                    <div class="form-group">
                        <label>Email Address <span class="required">*</span></label>
                        <div class="input-icon-wrapper">
                            <input type="email" name="email" placeholder="Enter your email address" required>
                            <span class="input-icon">&#9993;</span>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Password <span class="required">*</span></label>
                        <div class="input-icon-wrapper">
                            <input type="password" name="password" id="passwordField" placeholder="Enter your password" required>
                            <span class="input-icon toggle-password" onclick="togglePassword()" style="cursor:pointer;">&#128065;</span>
                        </div>
                    </div>

                    <button type="submit" class="login-btn">Sign In</button>
                </form>

                <div class="divider">or</div>

                <div class="register-link">
                    Don't have an account? <a href="/register">Register here</a>
                </div>
            </div>
        </div>
    </main>

    <footer>
        <div class="footer-content">
            <img src="/images/img1.jpeg" alt="Institute Logo" class="brand-logo sm">
            <p>&copy; 2026 Akademy of Knowledge Bridge. All rights reserved.</p>
        </div>
    </footer>

    <script>
        function togglePassword() {
            const field = document.getElementById('passwordField');
            const icon = document.querySelector('.toggle-password');
            if (field.type === 'password') {
                field.type = 'text';
                icon.innerHTML = '&#128580;';
            } else {
                field.type = 'password';
                icon.innerHTML = '&#128065;';
            }
        }
    </script>
</body>
</html>
