<svg width="320" height="180" viewBox="0 0 320 180" xmlns="http://www.w3.org/2000/svg">

  <!-- Background -->
  <rect width="320" height="180" rx="18" fill="#fff5f4"/>

  <!-- Decorative shapes -->
  <circle cx="280" cy="30" r="40" fill="#f8dada" opacity="0.6"/>
  <circle cx="40" cy="150" r="50" fill="#f8dada" opacity="0.4"/>

  <!-- Main Panel -->
  <rect x="70" y="30" width="180" height="110" rx="14" fill="#f2cfcf"/>

  <!-- Profile Circle -->
  <circle cx="120" cy="75" r="18" fill="#b23a3a"/>

  <!-- Body -->
  <rect x="102" y="95" width="36" height="22" rx="8" fill="#b23a3a"/>

  <!-- Settings Gear (Admin symbol) -->
  <g transform="translate(180,65)">
    <circle cx="0" cy="0" r="12" fill="#ffffff"/>
    <circle cx="0" cy="0" r="5" fill="#b23a3a"/>
    <g stroke="#b23a3a" stroke-width="2">
      <line x1="0" y1="-16" x2="0" y2="-10"/>
      <line x1="0" y1="16" x2="0" y2="10"/>
      <line x1="-16" y1="0" x2="-10" y2="0"/>
      <line x1="16" y1="0" x2="10" y2="0"/>
      <line x1="-11" y1="-11" x2="-7" y2="-7"/>
      <line x1="11" y1="-11" x2="7" y2="-7"/>
      <line x1="-11" y1="11" x2="-7" y2="7"/>
      <line x1="11" y1="11" x2="7" y2="7"/>
    </g>
  </g>

  <!-- Bottom Label -->
  <text x="160" y="165" text-anchor="middle"
        font-family="Segoe UI, Arial, sans-serif"
        font-size="18"
        font-weight="600"
        fill="#a83232">
    Administrative
  </text>

</svg>