spring.application.name=Akademy of Knowledge Bridge - SCMS

# Aiven MySQL Configuration
# Use environment variables in production to avoid committing secrets.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://mysql-3c9edaea-scmsuni.a.aivencloud.com:13336/defaultdb?sslMode=REQUIRED&serverTimezone=UTC}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:avnadmin}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}


# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Thymeleaf Configuration
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.cache=false

# File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Server Configuration
server.port=9090

# Session Configuration - keep session alive for 24 hours
server.servlet.session.timeout=86400
server.servlet.session.cookie.max-age=86400

# Email (SMTP) Configuration for verification codes
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=chandimacbbandara@gmail.com

# Gemini AI Moderation Configuration
# IMPORTANT: Paste your API key in the value below.
gemini.api.key=${GEMINI_API_KEY:}
gemini.model=gemini-2.0-flash

# Concern Priority AI Model Configuration
concern.priority.ai.enabled=true
concern.priority.ai.python-command=/usr/bin/python3.12
concern.priority.ai.script-path=ai-model/concern-priority/predict_priority.py
concern.priority.ai.model-dir=ai-model/concern-priority
concern.priority.ai.default-priority=Medium
concern.priority.ai.timeout-seconds=30
